name: PR Workflow

on:
  pull_request:
    branches: [development, release-*]

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  test:
    uses: epam/ai-dial-ci/.github/workflows/java_test.yml@3.1.3
    with:
      bypass-checks: false
      style-checks-enabled: true
      style-checks-bypassed: false
      code-checks-enabled: true
      code-checks-bypassed: false
      ort-enabled: true
      ort-bypassed: false
      ort-version: "latest"
      java-version: "17"
      java-distribution: "temurin"
      runs-on: '["ubuntu-24.04"]'

  build_jar:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          lfs: true

      - uses: epam/ai-dial-ci/actions/java_prepare@3.1.3
        with:
          java-version: "17"
          java-distribution: "temurin"
          build-scan-publish: true

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew        

      - run: ./gradlew build -x test
        env:
          GPR_USERNAME: ${{ github.actor }}
          GPR_PASSWORD: ${{ secrets.GITHUB_TOKEN }}

      - name: check if lib exists
        run: ls -la build/libs/

      - name: 'Upload Artifact'
        uses: actions/upload-artifact@v4
        with:
          name: aidial-keycloak-mappers-0.1.0.jar
          path: build/libs/aidial-keycloak-mappers-0.1.0.jar

      