name: PR Workflow

on:
  pull_request:
    branches: [development, release-*]

permissions:
  contents: read
  security-events: write

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  run_tests:
    uses: epam/ai-dial-ci/.github/workflows/java_test.yml@3.2.0
    secrets: inherit
    with:
      java-version: 21

  trivy_scan:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21

      - name: Build project
        run: ./gradlew build -x test

      - name: Generate Gradle dependency lock
        run: ./gradlew dependencies --write-locks

      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@0.35.0
        with:
          scan-type: fs
          scan-ref: .
          format: json
          output: trivy-results.json
          exit-code: 0

      - name: Generate Trivy SARIF report
        run: trivy convert --format sarif --output trivy-results.sarif --exit-code 0 trivy-results.json
        env:
          TRIVY_SEVERITY: CRITICAL,HIGH,MEDIUM,LOW,UNKNOWN

      - name: Upload Trivy SARIF to GitHub Security
        uses: github/codeql-action/upload-sarif@v4
        if: always()
        with:
          sarif_file: trivy-results.sarif

      - name: Fail on vulnerability findings
        run: trivy convert --format table --exit-code 1 trivy-results.json
        env:
          TRIVY_SEVERITY: CRITICAL,HIGH