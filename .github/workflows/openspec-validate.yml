name: openspec-validate

on:
  pull_request:
    paths:
      - "openspec/**"
      - ".github/workflows/openspec-validate.yml"

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Validate OpenSpec changes and specs
        run: npx -y @fission-ai/openspec@1.13.0 validate --all --strict
