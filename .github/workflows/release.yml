name: Release Workflow

on:
  workflow_dispatch:
    inputs:
      version:
        description: "New version to release"
        required: true

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number }}
  cancel-in-progress: true

env:
  TAG: ${{ github.event.inputs.version }}

jobs:
  publish:
    runs-on: ubuntu-24.04

    permissions:
      contents: write

    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          lfs: true

      - uses: epam/ai-dial-ci/actions/java_prepare@4.0.0
        with:
          java-version: "21"
          java-distribution: "temurin"
          build-scan-publish: true

      - run: ./gradlew build -x test
        env:
          TAG: ${{ env.TAG }}
          GPR_USERNAME: ${{ github.actor }}
          GPR_PASSWORD: ${{ secrets.GITHUB_TOKEN }}

      - name: publish to Github packages
        run: ./gradlew publish
        env:
          TAG: ${{ env.TAG }}
          GPR_USERNAME: ${{ github.actor }}
          GPR_PASSWORD: ${{ secrets.PAT_TOKEN }}

      - name: Create Github Release
        uses: ncipollo/release-action@339a81892b84b4eeb0f6e744e4574d79d0d9b8dd # v1.21.0
        with:
          name: "ai-dial-keycloak-helpers ${{ env.TAG }}"
          artifacts: "build/libs/aidial-keycloak-mappers-${{ env.TAG }}.jar" # file name example aidial-keycloak-mappers-0.1.1
          allowUpdates: true
          generateReleaseNotes: true
          tag: ${{ env.TAG }}
          draft: false
          prerelease: false
          token: ${{ secrets.GITHUB_TOKEN }}





