schema: spec-driven

# Project context (optional)
# This is shown to AI when creating artifacts.
context: |
  Tech stack: Java 17, Gradle 8, Keycloak SPI extension (OIDC protocol mappers,
  identity-provider mappers, Microsoft Graph providers). Checkstyle runs as
  part of `gradlew check`. Conventional Commits enforced by CI on PR titles.
  Public repository: no internal repo, decision-log, or private-environment
  references may appear in specs, code comments, or commit messages.
  Requirements follow RFC 2119 wording with one SHALL/MUST per requirement,
  observable behavior only, and GIVEN/WHEN/THEN scenarios covering the
  edge/error cases.

# Per-artifact rules (optional)
# Add custom rules for specific artifacts.
# Example:
#   rules:
#     proposal:
#       - Keep proposals under 500 words
#       - Always include a "Non-goals" section
#     tasks:
#       - Break tasks into chunks of max 2 hours

# Per-operation guidance (optional)
# Add advisory guidance for how apply and archive work should be conducted.
# This is separate from artifact rules above.
# Example:
#   operations:
#     apply:
#       guidance:
#         - Keep test summaries concise
#     archive:
#       guidance:
#         - Summarize the archive outcome before finishing
